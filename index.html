<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live EN → RU</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px;
  background: #080808;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.container {
  max-width: 1100px;
  margin: auto;
}

h1 {
  font-size: 34px;
  margin-bottom: 30px;
}

button {
  width: 100%;
  padding: 22px;
  margin-bottom: 14px;
  border: 0;
  border-radius: 16px;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
}

#start {
  background: #22c55e;
  color: white;
}

#stop {
  background: #ef4444;
  color: white;
}

#clear {
  background: #292929;
  color: white;
}

#status {
  font-size: 25px;
  font-weight: 700;
  margin: 30px 0;
}

.label {
  color: #777;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  margin: 28px 0 10px;
}

#russian {
  background: #171717;
  border-radius: 16px;
  padding: 24px;
  min-height: 110px;

  font-size: 34px;
  line-height: 1.45;
}

#english {
  background: #111;
  border-radius: 16px;
  padding: 18px;

  min-height: 65px;

  font-size: 20px;
  line-height: 1.4;

  color: #aaa;
}

#history {
  margin-top: 10px;
}

.phrase {
  padding: 22px 0;
  border-bottom: 1px solid #292929;
}

.phraseRussian {
  font-size: 28px;
  line-height: 1.45;
}

.phraseEnglish {
  color: #777;
  margin-top: 8px;
  font-size: 16px;
}

#debug {
  color: #777;
  margin-top: 30px;
  font-size: 15px;
  white-space: pre-wrap;
}

.red {
  color: #ff4d4d;
}

@media(max-width:600px) {

  body {
    padding: 15px;
  }

  h1 {
    font-size: 27px;
  }

  #russian {
    font-size: 28px;
  }

  .phraseRussian {
    font-size: 25px;
  }
}
</style>
</head>


<body>

<div class="container">

<h1>🎧 Live EN → RU</h1>


<button id="start">
🎙 НАЧАТЬ СЛУШАТЬ
</button>


<button id="stop">
■ ОСТАНОВИТЬ
</button>


<button id="clear">
✕ ОЧИСТИТЬ
</button>


<div id="status">
Готов
</div>


<div class="label">
🇷🇺 ПЕРЕВОД
</div>

<div id="russian">
Нажмите «Начать слушать»
</div>


<div class="label">
🇺🇸 ЧТО УСЛЫШАЛ
</div>

<div id="english">
-
</div>


<div class="label">
ИСТОРИЯ РАЗГОВОРА
</div>

<div id="history"></div>


<div id="debug">
Ожидание...
</div>

</div>


<script>

let recognition = null;

let running = false;

let restartTimer = null;

let translateTimer = null;

let lastText = "";

let lastFinalText = "";

let requestNumber = 0;


const startButton =
  document.getElementById("start");

const stopButton =
  document.getElementById("stop");

const clearButton =
  document.getElementById("clear");

const statusBox =
  document.getElementById("status");

const russianBox =
  document.getElementById("russian");

const englishBox =
  document.getElementById("english");

const historyBox =
  document.getElementById("history");

const debugBox =
  document.getElementById("debug");



/* ==========================
   TRANSLATION
========================== */

async function translate(text) {

  if (!text) {
    return "";
  }

  const currentRequest =
    ++requestNumber;

  try {

    const url =
      "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(text) +
      "&langpair=en|ru";

    const response =
      await fetch(url);

    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }

    const data =
      await response.json();


    if (
      currentRequest !== requestNumber
    ) {

      return null;

    }


    if (
      data &&
      data.responseData &&
      data.responseData.translatedText
    ) {

      return decodeHTML(
        data.responseData.translatedText
      );

    }


    throw new Error(
      "Перевод не получен"
    );


  } catch(error) {

    debugBox.innerText =
      "❌ Ошибка перевода: " +
      error.message;

    return "";

  }

}



function decodeHTML(text) {

  const element =
    document.createElement("textarea");

  element.innerHTML =
    text;

  return element.value;

}



/* ==========================
   LIVE TRANSLATION
========================== */

function translateLive(text) {

  if (!text) {
    return;
  }


  lastText =
    text;


  clearTimeout(
    translateTimer
  );


  /*
  Небольшая задержка нужна,
  чтобы не отправлять API запрос
  после каждого отдельного слова.
  */

  translateTimer =
    setTimeout(
      async function() {

        const textToTranslate =
          lastText;


        russianBox.innerText =
          "Перевожу...";


        const translated =
          await translate(
            textToTranslate
          );


        if (
          translated &&
          textToTranslate === lastText
        ) {

          russianBox.innerText =
            translated;

        }

      },
      300
    );

}



/* ==========================
   SAVE FINAL PHRASE
========================== */

async function savePhrase(
  englishText
) {

  if (!englishText) {
    return;
  }


  if (
    englishText === lastFinalText
  ) {

    return;

  }


  lastFinalText =
    englishText;


  const translated =
    await translate(
      englishText
    );


  if (!translated) {
    return;
  }


  russianBox.innerText =
    translated;


  const phrase =
    document.createElement("div");

  phrase.className =
    "phrase";


  const ru =
    document.createElement("div");

  ru.className =
    "phraseRussian";

  ru.innerText =
    translated;


  const en =
    document.createElement("div");

  en.className =
    "phraseEnglish";

  en.innerText =
    englishText;


  phrase.appendChild(ru);

  phrase.appendChild(en);

  historyBox.appendChild(
    phrase
  );


  window.scrollTo({

    top:
      document.body.scrollHeight,

    behavior:
      "smooth"

  });

}



/* ==========================
   CREATE RECOGNITION
========================== */

function createRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    statusBox.innerText =
      "❌ Speech Recognition не поддерживается";

    russianBox.innerText =
      "Откройте сайт в Google Chrome";

    return null;

  }


  const rec =
    new SpeechRecognition();


  rec.lang =
    "en-US";


  /*
  Для живого разговора.
  */

  rec.continuous =
    true;


  /*
  Получаем текст еще до того,
  как человек закончил предложение.
  */

  rec.interimResults =
    true;


  rec.maxAlternatives =
    1;



  /* START */

  rec.onstart =
    function() {

      statusBox.innerHTML =
        '<span class="red">🔴 СЛУШАЮ...</span>';

      debugBox.innerText =
        "🎙 Микрофон активен";

    };



  /* AUDIO */

  rec.onaudiostart =
    function() {

      debugBox.innerText =
        "🎧 Получаю звук";

    };



  /* SOUND */

  rec.onsoundstart =
    function() {

      debugBox.innerText =
        "🔊 Слышу звук";

    };



  /* SPEECH */

  rec.onspeechstart =
    function() {

      debugBox.innerText =
        "🗣 Слышу речь";

    };



  /* RESULT */

  rec.onresult =
    function(event) {

      let interim =
        "";

      let finalText =
        "";


      for (
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ) {

        const text =
          event.results[i][0]
            .transcript
            .trim();


        if (!text) {
          continue;
        }


        if (
          event.results[i].isFinal
        ) {

          finalText +=
            text + " ";

        }

        else {

          interim +=
            text + " ";

        }

      }


      interim =
        interim.trim();

      finalText =
        finalText.trim();



      /*
      INTERIM
      Человек еще говорит
      */

      if (interim) {

        englishBox.innerText =
          interim;


        debugBox.innerText =
          "🇺🇸 Распознаю:\n" +
          interim;


        translateLive(
          interim
        );

      }



      /*
      FINAL
      Фраза закончена
      */

      if (finalText) {

        englishBox.innerText =
          finalText;


        debugBox.innerText =
          "✅ Распознано:\n" +
          finalText;


        savePhrase(
          finalText
        );

      }

    };



  /* ERROR */

  rec.onerror =
    function(event) {

      console.log(
        "Speech error:",
        event.error
      );


      if (
        event.error ===
        "not-allowed"
      ) {

        running =
          false;

        statusBox.innerText =
          "❌ Нет доступа к микрофону";

        russianBox.innerText =
          "Разрешите доступ к микрофону";

        return;

      }


      if (
        event.error ===
        "audio-capture"
      ) {

        running =
          false;

        statusBox.innerText =
          "❌ Микрофон недоступен";

        return;

      }


      if (
        event.error ===
        "no-speech"
      ) {

        debugBox.innerText =
          "⏳ Жду английскую речь...";

        return;

      }


      if (
        event.error ===
        "network"
      ) {

        debugBox.innerText =
          "❌ Ошибка Speech Recognition Network";

        return;

      }


      debugBox.innerText =
        "❌ Speech error: " +
        event.error;

    };



  /* END */

  rec.onend =
    function() {

      if (!running) {

        statusBox.innerText =
          "■ Остановлено";

        return;

      }


      /*
      Chrome иногда сам
      завершает распознавание.
      Запускаем его снова.
      */

      clearTimeout(
        restartTimer
      );


      restartTimer =
        setTimeout(
          function() {

            if (!running) {
              return;
            }


            try {

              rec.start();

            }

            catch(error) {

              console.log(
                error
              );

            }

          },
          300
        );

  };


  return rec;

}



/* ==========================
   START
========================== */

function startListening() {

  if (running) {
    return;
  }


  recognition =
    createRecognition();


  if (!recognition) {
    return;
  }


  running =
    true;


  russianBox.innerText =
    "Слушаю английскую речь...";


  englishBox.innerText =
    "Ожидание речи...";


  try {

    recognition.start();

  }

  catch(error) {

    running =
      false;

    debugBox.innerText =
      "❌ " + error.message;

  }

}



/* ==========================
   STOP
========================== */

function stopListening() {

  running =
    false;


  clearTimeout(
    restartTimer
  );


  clearTimeout(
    translateTimer
  );


  if (recognition) {

    try {

      recognition.stop();

    }

    catch(error) {}

  }


  statusBox.innerText =
    "■ Остановлено";

}



/* ==========================
   CLEAR
========================== */

function clearEverything() {

  historyBox.innerHTML =
    "";


  englishBox.innerText =
    "-";


  russianBox.innerText =
    running
      ? "Слушаю английскую речь..."
      : "Нажмите «Начать слушать»";


  debugBox.innerText =
    running
      ? "🎙 Микрофон активен"
      : "Ожидание...";


  lastText =
    "";


  lastFinalText =
    "";

}



/* ==========================
   BUTTONS
========================== */

startButton.addEventListener(
  "click",
  startListening
);


stopButton.addEventListener(
  "click",
  stopListening
);


clearButton.addEventListener(
  "click",
  clearEverything
);

</script>

</body>
</html>
